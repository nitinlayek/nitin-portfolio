<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#020617;
font-family:Consolas,monospace;

#matrix{
position:fixed;

align-items:center;

.glow{

.container{

margin:auto;
padding:30px;
}
.hero,.section{
background:rgba(255,255,255,.04);
backdrop-filter:blur(12px);
border:1px solid rgba(0,255,238,.15);

padding:30px;
margin-bottom:30px;
}
.hero{text-align:center}
.profile{
width:220px;height:220px;
border-radius:50%;
border:4px solid #00ffee;
box-shadow:0 0 30px #00ffee;
animation:float 4s ease-in-out infinite;
object-fit:cover;
}
@keyframes float{
50%{transform:translateY(-10px)}
}
h1{
font-size:4rem;
margin-top:20px;
text-shadow:0 0 20px #00ffee;
}

min-height:35px;

.links{

gap:15px;
margin-top:30px;
}
.links a{
text-decoration:none;
color:white;
padding:14px 22px;
border-radius:12px;
border:1px solid rgba(0,255,238,.4);
background:rgba(255,255,255,.05);
transition:.4s;
font-weight:600;
}
.links a i{
margin-right:8px;
font-size:18px;
}
.links a:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 0 25px #00ffee;
background:#00ffee;
color:black;
}
.codebox{
white-space:pre-wrap;
line-height:1.8;
color:#7CFC00;
}
h2{margin-bottom:15px}
.bio-card{
margin:20px auto;
max-width:750px;
padding:22px;
border-radius:20px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,255,238,.25);
backdrop-filter:blur(15px);
box-shadow:
0 0 20px rgba(0,255,238,.15),
inset 0 0 20px rgba(255,255,255,.05);
}

.bio-card h3{
font-size:1.5rem;
letter-spacing:3px;
color:#00ffee;
margin-bottom:12px;
text-shadow:
0 0 10px #00ffee,
0 0 25px #00ffee;
}

.student-info{
margin-bottom:15px;
font-size:1rem;
font-weight:600;
color:white;
}

.college-link{
display:inline-block;
padding:14px 28px;
text-decoration:none;
color:white;
font-weight:700;
border-radius:50px;

background:linear-gradient(
135deg,
#00ffee,
#0099ff,
#7b2ff7
);

background-size:300% 300%;

box-shadow:
0 0 15px #00ffee,
0 0 35px rgba(0,255,238,.4);

transition:.4s ease;
animation:glowMove 5s linear infinite;
}

.college-link:hover{
transform:translateY(-4px) scale(1.05);

box-shadow:
0 0 25px #00ffee,
0 0 50px #00ffee,
0 0 80px rgba(0,255,238,.6);
}

@keyframes glowMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
footer{
text-align:center;
padding:20px;
color:#94a3b8;

<script>
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const chars="01{}[]<>#include<iostream>;";
const fontSize=14;
const columns=canvas.width/fontSize;
const drops=[];

for(let i=0;i<columns;i++) drops[i]=1;

function draw(){
ctx.fillStyle="rgba(2,6,23,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#00ffee";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){
const text=chars[Math.floor(Math.random()*chars.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);
if(drops[i]*fontSize>canvas.height && Math.random()>0.98) drops[i]=0;
drops[i]++;
}
}
setInterval(draw,35);

const lines=[
"INITIALIZING AI PORTFOLIO...",
"CONNECTING TO NITIN_LAYEK...",
"AUTHENTICATION SUCCESSFUL",
"WELCOME TO THE DIGITAL UNIVERSE"
];

let x=0;

function boot(){
if(x<lines.length){
document.getElementById("bootText").innerHTML+=lines[x]+"<br>";
x++;
setTimeout(boot,250);
}else{
setTimeout(()=>{
document.getElementById("boot").style.display="none";
document.getElementById("site").classList.remove("hidden");
startTyping();
},300);
}
}
boot();

function type(id,text,speed){
let i=0;
const el=document.getElementById(id);
const t=setInterval(()=>{
el.innerHTML+=text.charAt(i);
i++;
if(i>=text.length) clearInterval(t);
},speed);
}

function startTyping(){
type("name","NITIN LAYEK",35);

setTimeout(()=>{
type("role","Web Developer | C++ Learner | Future Software Engineer",20);
},600);

setTimeout(()=>{
type("about",
"> Passionate learner exploring Web Development and C++.\n> Building websites.\n> Solving coding problems.\n> Growing every day.",
12);
},1800);

setTimeout(()=>{
type("skills",
"✓ HTML\n✓ CSS\n✓ JavaScript\n✓ C++\n✓ GitHub\n✓ Responsive Design",
12);
},3500);

setTimeout(()=>{
type("mission",
"Goal: Become a world-class Software Engineer and build impactful digital products.",
12);
},5000);
}
</script>
